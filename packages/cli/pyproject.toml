[project]
name = "coding-trajectory"
version = "0.1.0"
description = "CLI for querying canonical session graph resources"
requires-python = ">=3.12"
dependencies = [
    "coding-trajectory-core",
]

[project.optional-dependencies]
tui = ["textual>=2.0"]

[project.scripts]
ct = "coding_trajectory_cli.cli:main"

[project.entry-points."coding_trajectory.cli_plugins"]
activity = "coding_trajectory_cli.builtins.activity:plugin"
dashboard = "coding_trajectory_cli.builtins.dashboard:plugin"

[tool.uv.sources]
coding-trajectory-core = { workspace = true }

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_trajectory_cli"]
