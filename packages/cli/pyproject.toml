[project]
name = "coding-trajectory"
version = "0.1.0"
description = "CLI for querying canonical session graph resources"
requires-python = ">=3.12"
dependencies = [
    "coding-trajectory-core",
    "keyring>=25.6",
    "packaging>=24.0",
    "pydantic>=2.12.5",
]

[project.scripts]
ct = "coding_trajectory_cli.cli:main"

[tool.uv.sources]
coding-trajectory-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_trajectory_cli"]
