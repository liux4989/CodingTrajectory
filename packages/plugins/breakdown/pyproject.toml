[project]
name = "ct-plugin-breakdown"
version = "0.1.0"
description = "Read-only CodingTrajectory session breakdown"
requires-python = ">=3.12"
dependencies = ["coding-trajectory-core", "pydantic>=2.12.5"]

[tool.uv.sources]
coding-trajectory-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["breakdown_plugin"]
