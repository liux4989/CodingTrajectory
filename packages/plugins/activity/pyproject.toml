[project]
name = "ct-plugin-activity"
version = "0.1.0"
description = "Recent coding activity plugin for CodingTrajectory"
requires-python = ">=3.12"

[project.scripts]
ct-activity = "ct_plugin_activity.activity:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"activity.py" = "ct_plugin_activity/activity.py"
"ct-plugin.json" = "ct_plugin_activity/ct-plugin.json"
