[project]
name = "coding-trajectory-plugins"
version = "0.1.0"
description = "Built-in executable plugins for CodingTrajectory"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
artifacts = [
    "activity/ct-activity",
    "activity/ct-plugin.json",
    "dashboard/ct-dashboard",
    "dashboard/ct-plugin.json",
]
