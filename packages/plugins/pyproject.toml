[project]
name = "coding-trajectory-plugins"
version = "0.1.0"
description = "Built-in executable plugins for CodingTrajectory"
requires-python = ">=3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"activity/activity.py" = "coding_trajectory_plugins/activity/activity.py"
"activity/ct-plugin.json" = "coding_trajectory_plugins/activity/ct-plugin.json"
"dashboard/dashboard.py" = "coding_trajectory_plugins/dashboard/dashboard.py"
"dashboard/cleanup.py" = "coding_trajectory_plugins/dashboard/cleanup.py"
"dashboard/ct-plugin.json" = "coding_trajectory_plugins/dashboard/ct-plugin.json"
