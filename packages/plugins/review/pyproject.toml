[project]
name = "ct-plugin-review"
version = "0.1.0"
description = "LLM-judge session review plugin for CodingTrajectory"
requires-python = ">=3.12"

[project.scripts]
ct-review = "ct_plugin_review.review:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"review.py" = "ct_plugin_review/review.py"
"ct-plugin.json" = "ct_plugin_review/ct-plugin.json"
