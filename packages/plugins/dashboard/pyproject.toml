[project]
name = "ct-plugin-dashboard"
version = "0.1.0"
description = "Project and session dashboard plugin for CodingTrajectory"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
    "textual>=0.85.2",
]

[project.scripts]
ct-dashboard = "ct_plugin_dashboard.dashboard:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
    "*.py",
    "ct-plugin.json",
    "web/dist",
]
artifacts = ["web/dist"]

[tool.hatch.build.targets.wheel.force-include]
"account.py" = "ct_plugin_dashboard/account.py"
"cleanup.py" = "ct_plugin_dashboard/cleanup.py"
"cleanup_tui.py" = "ct_plugin_dashboard/cleanup_tui.py"
"codex_auth.py" = "ct_plugin_dashboard/codex_auth.py"
"codex_rpc.py" = "ct_plugin_dashboard/codex_rpc.py"
"context_window.py" = "ct_plugin_dashboard/context_window.py"
"dashboard.py" = "ct_plugin_dashboard/dashboard.py"
"dashboard_tui.py" = "ct_plugin_dashboard/dashboard_tui.py"
"dashboard_web.py" = "ct_plugin_dashboard/dashboard_web.py"
"token_pricing.py" = "ct_plugin_dashboard/token_pricing.py"
"ct-plugin.json" = "ct_plugin_dashboard/ct-plugin.json"
"web/dist" = "ct_plugin_dashboard/web/dist"
