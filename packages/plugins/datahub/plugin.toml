name = "datahub"
description = "Project and session data hub with analytics and management."
entry = "datahub.py"

[requires]
"project.list" = 2
"project.sessions" = 2
"session.overview" = 2
"session.tree" = 2
"session.stats" = 2
"session.usage" = 2
"session.model_usage" = 2
"session.tool_usage" = 2
"session.items" = 2
"session.events" = 2
"graph.overview" = 2
"graph.stats" = 2
"graph.usage" = 2
"estimate.predict" = 1
"estimate.bind" = 1
"estimate.get" = 1
"estimate.list" = 1
"estimate.calibration" = 1
"estimate.backfill.start" = 1
"estimate.backfill.status" = 1

[[tools]]
name = "."
summary = "Show Datahub entry information."

[[tools]]
name = "web"
summary = "Run the Datahub web program."

[[tools]]
name = "project/cleanup"
summary = "Clean old project directories."

[[tools]]
name = "session/cleanup"
summary = "Clean orphaned or low-value session logs."

[[tools]]
name = "session/context-window"
summary = "Inspect session context composition and trajectory events."

[[tools]]
name = "code-time"
summary = "Show coding time summary."

[[tools]]
name = "code-time/forecast"
summary = "Agent temporality: duration forecasts versus measured actuals."
