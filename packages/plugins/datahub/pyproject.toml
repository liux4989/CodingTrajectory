[project]
name = "ct-plugin-datahub"
version = "0.1.0"
description = "Project and session data hub plugin for CodingTrajectory"
requires-python = ">=3.12"
dependencies = [
    "coding-trajectory-core",
    "httpx>=0.28",
    "pydantic>=2.12.5",
]

[tool.uv.sources]
coding-trajectory-core = { workspace = true }

[tool.pywrangler]
allow-build = true

[dependency-groups]
dev = [
    "workers-py>=1.17",
    "workers-runtime-sdk>=0.0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["datahub_plugin"]
