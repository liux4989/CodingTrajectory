[project]
name = "coding-trajectory-core"
version = "0.1.0"
description = "Core models, ingestion, and query layer for coding agent session graph data"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.12.5",
    "tiktoken>=0.7.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_trajectory"]
