[project]
name = "coding-trajectory-benchmarks"
version = "0.1.0"
description = "Benchmark suite for coding trajectory analysis"
requires-python = ">=3.12"
dependencies = [
    "coding-trajectory-core",
    "pydantic>=2.0",
]

[project.scripts]
ct-bench = "ct_benchmarks.fsm:main"

[tool.uv.sources]
coding-trajectory-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ct_benchmarks"]
