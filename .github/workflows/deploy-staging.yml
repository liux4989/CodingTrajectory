name: Prepare sealed batch release

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      release_id:
        required: true
        type: string
      target:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: control-plane-staging-deploy
  cancel-in-progress: false

env:
  UV_FROZEN: "true"
  WRANGLER_SEND_METRICS: "false"
  CI: "true"

# Build only. A release_id increment is the sole entry point from Core CI.
# Account credentials cannot prove live prepared-data compatibility.
# Activation runs on the authorized host with scoped reader profiles; see README.
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require the reviewed batch commit
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$GITHUB_REF" = refs/heads/main

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.14"
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.9"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.0"

      - name: Install locked dependencies
        run: |
          uv sync --all-packages --frozen
          npm --prefix cloudflare/control-plane ci

      - name: Bind candidate to release marker
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          uv run python scripts/check-release.py validate --ref "$GITHUB_SHA" \
            --expect-id "$RELEASE_ID" --expect-target "$RELEASE_TARGET"

      - name: Prepare immutable local release
        run: |
          uv run python scripts/deploy-release.py prepare \
            --source-sha "$GITHUB_SHA" --run-dir "$RUNNER_TEMP/staging-release"
          uv run python scripts/deploy-release.py verify \
            --run-dir "$RUNNER_TEMP/staging-release" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve synthetic qualification and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: batch-release-${{ inputs.release_id }}-${{ inputs.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/staging-release/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
