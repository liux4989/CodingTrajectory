name: Core CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-contracts:
    name: Python and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.9"
          enable-cache: true

      - name: Install locked Python workspace
        run: uv sync --all-packages --frozen

      - name: Validate batch release intent
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$GITHUB_SHA"
          if [ "$EVENT_NAME" = push ]; then
            base="$PUSH_BASE"
          elif [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE"
          fi
          uv run python scripts/check-release.py change \
            --base-ref "$base" --head-ref "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Check Python sources
        run: |
          uv run python -m compileall -q packages/core/src packages/cli/src
          uv run ruff check packages/plugins/loop/loop_plugin scripts/check-loop.py scripts/prepare-loop-demo.py

      - name: Validate repository contracts
        run: |
          uv run python scripts/check-core-protocol.py
          uv run python scripts/validate-local-first-source-selection.py

      - name: Validate command activity and retained replay
        run: uv run python scripts/benchmark-session-retrieval.py --command-activity-only --no-write

      - name: Validate metric baselines
        run: |
          scripts/check-metrics-quality-gate.sh
          uv run python scripts/validate-metrics-baselines.py
          uv run python scripts/validate-amp-live.py

  loop-web:
    name: Loop web and local integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.9"
          enable-cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install locked dependencies
        run: |
          uv sync --all-packages --frozen
          bun --cwd packages/plugins/loop/web ci

      - name: Check and build Loop
        working-directory: packages/plugins/loop/web
        run: |
          bun run check
          bun run build

      - name: Qualify local Loop integration
        run: uv run python scripts/check-loop.py
