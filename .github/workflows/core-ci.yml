name: Core CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-contracts:
    name: Python and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_ready: ${{ steps.release.outputs.release_ready }}
      release_id: ${{ steps.release.outputs.release_id }}
      release_target: ${{ steps.release.outputs.target }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.9"
          enable-cache: true

      - name: Install locked Python workspace
        run: uv sync --all-packages --frozen

      - name: Validate batch release intent
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BASE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          base="$GITHUB_SHA"
          if [ "$EVENT_NAME" = push ]; then
            base="$PUSH_BASE"
          elif [ "$EVENT_NAME" = pull_request ]; then
            base="$PR_BASE"
          fi
          uv run python scripts/check-release.py change \
            --base-ref "$base" --head-ref "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Check Python sources
        run: |
          uv run python -m compileall -q packages/core/src packages/cli/src
          uv run ruff check packages/plugins/loop/loop_plugin scripts/check-loop.py scripts/prepare-loop-demo.py

      - name: Validate repository contracts
        run: |
          uv run python scripts/check-core-protocol.py
          uv run python scripts/validate-local-first-source-selection.py
          uv run python scripts/qualify-canonical-repository.py
          uv run python scripts/qualify-connection-workflows.py

      - name: Validate metric baselines
        run: uv run python scripts/validate-metrics-baselines.py

  cloudflare-web:
    name: Cloudflare and web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.12.9"
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloudflare/control-plane/package-lock.json

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install locked dependencies
        run: |
          uv sync --all-packages --frozen
          uv sync --project cloudflare/control-plane --frozen
          npm --prefix cloudflare/control-plane ci
          bun --cwd packages/plugins/loop/web ci

      - name: Check control plane
        run: npm --prefix cloudflare/control-plane run check

      - name: Qualify Python Worker publication and reads
        run: |
          uv run python scripts/qualify-prepared-api.py --fixture-output .artifacts/ci/prepared-fixture.json
          node scripts/qualify-prepared-api.mjs .artifacts/ci/prepared-fixture.json --publication .artifacts/ci/publication.json
          uv run python scripts/qualify-deploy-release.py
          git diff --exit-code -- cloudflare/control-plane/uv.lock cloudflare/control-plane/pylock.toml

      - name: Check and build Loop
        working-directory: packages/plugins/loop/web
        run: |
          bun run check
          bun run build

      - name: Qualify local Loop integration
        run: uv run python scripts/check-loop.py

      - name: Bundle control plane without deploying
        run: uv run python scripts/build-python-worker.py --outdir .artifacts/ci/control-plane

  release-candidate:
    name: Sealed batch release candidate
    needs: [python-contracts, cloudflare-web]
    if: >-
      github.event_name == 'push' &&
      needs.python-contracts.outputs.release_ready == 'true'
    uses: ./.github/workflows/deploy-staging.yml
    with:
      source_sha: ${{ github.sha }}
      release_id: ${{ needs.python-contracts.outputs.release_id }}
      target: ${{ needs.python-contracts.outputs.release_target }}
