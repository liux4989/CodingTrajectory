name: CI

on:
  push:
    branches:
      - main

jobs:
  packaged-plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Lint CLI and packaging scripts
        run: uv run ruff check packages/cli/src/coding_trajectory_cli scripts/check_packaged_plugins.py

      - name: Compile Python sources
        run: uv run python -m compileall -q packages scripts

      - name: Check packaged plugin installation
        run: uv run python scripts/check_packaged_plugins.py
