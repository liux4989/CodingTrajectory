[project]
name = "coding-trajectory"
version = "0.1.0"
description = "Unified Coding Agent Trajectory & Metrics Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12.5",
]

[project.scripts]
coding-trajectory = "coding_trajectory.cli:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_trajectory"]
